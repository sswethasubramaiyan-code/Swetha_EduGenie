<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Learning Assistant</title>
    <!-- GitHub Pages & Local Compatible Stylesheet Links -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./static/style.css">
    <!-- Embedded Styles (guarantees CSS loads perfectly anywhere, zero file-not-found issues) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            /* Primary Light Theme - Clean, Fresh, Modern Azure & Slate (Zero Purple) */
            --bg-primary: #0b0f19;
            --bg-gradient: radial-gradient(circle at 12% 15%, rgba(14, 165, 233, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 88% 85%, rgba(37, 99, 235, 0.07) 0%, transparent 45%),
                #0b0f19;
            --card-bg: rgba(19, 27, 46, 0.92);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-title: #ffffff;

            --input-bg: #131b2e;
            --input-border: #263352;
            --input-text: #f8fafc;
            --input-focus-border: #38bdf8;
            --input-focus-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
            --input-placeholder: #64748b;

            --btn-bg: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            --btn-hover: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
            --btn-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
            --btn-shadow-hover: 0 6px 20px rgba(2, 132, 199, 0.45);

            --result-bg: #111827;
            --result-border: rgba(56, 189, 248, 0.25);
            --result-title: #38bdf8;
            --result-text: #e2e8f0;
            --result-inner-bg: #0f172a;
            --result-inner-border: #1e293b;

            --theme-btn-bg: rgba(30, 41, 59, 0.8);
            --theme-btn-border: rgba(255, 255, 255, 0.12);
            --theme-btn-text: #f1f5f9;
            --theme-btn-hover-bg: rgba(51, 65, 85, 0.9);
        }

        [data-theme="dark"] {
            /* Optional Dark Theme - Sleek Midnight Slate & Deep Azure (Zero Purple) */
            --bg-primary: #0b0f19;
            --bg-gradient: radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(37, 99, 235, 0.1) 0%, transparent 45%),
                #0b0f19;
            --card-bg: rgba(19, 27, 46, 0.92);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-title: #ffffff;

            --input-bg: #131b2e;
            --input-border: #263352;
            --input-text: #f8fafc;
            --input-focus-border: #38bdf8;
            --input-focus-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
            --input-placeholder: #64748b;

            --btn-bg: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            --btn-hover: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
            --btn-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
            --btn-shadow-hover: 0 6px 20px rgba(2, 132, 199, 0.45);

            --result-bg: #111827;
            --result-border: rgba(56, 189, 248, 0.25);
            --result-title: #38bdf8;
            --result-text: #e2e8f0;
            --result-inner-bg: #0f172a;
            --result-inner-border: #1e293b;

            --theme-btn-bg: rgba(30, 41, 59, 0.8);
            --theme-btn-border: rgba(255, 255, 255, 0.12);
            --theme-btn-text: #f1f5f9;
            --theme-btn-hover-bg: rgba(51, 65, 85, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px 80px;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Theme Toggle Bar */
        .top-nav {
            position: fixed;
            top: 18px;
            right: 22px;
            z-index: 100;
        }

        .theme-toggle-btn {
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-btn-border);
            color: var(--theme-btn-text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .theme-toggle-btn:hover {
            transform: translateY(-1px);
            background: var(--theme-btn-hover-bg);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header-section {
            text-align: center;
            margin-bottom: 34px;
            position: relative;
        }

        .main-title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #0f172a 10%, #0284c7 65%, #2563eb 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        [data-theme="dark"] .main-title {
            background: linear-gradient(135deg, #ffffff 20%, #38bdf8 65%, #60a5fa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Sections */
        .feature-section {
            width: 100%;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--text-title);
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        /* Input Row */
        .input-row {
            display: flex;
            width: 100%;
            gap: 12px;
            align-items: center;
        }

        .text-input {
            flex: 1;
            height: 46px;
            padding: 0 16px;
            background-color: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            font-size: 14.5px;
            font-family: inherit;
            color: var(--input-text);
            outline: none;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .text-input:focus {
            border-color: var(--input-focus-border);
            box-shadow: var(--input-focus-shadow);
        }

        .text-input::placeholder {
            color: var(--input-placeholder);
        }

        /* Primary Button */
        .btn-primary {
            height: 46px;
            padding: 0 22px;
            background: var(--btn-bg);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--btn-shadow);
            transition: background 0.2s ease, transform 0.12s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--btn-hover);
            transform: translateY(-1px);
            box-shadow: var(--btn-shadow-hover);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Box */
        .result-box {
            width: 100%;
            min-height: 0;
            background-color: var(--result-bg);
            border: 1.5px solid var(--result-border);
            border-radius: 12px;
            margin-top: 14px;
            box-shadow: var(--card-shadow);
            box-sizing: border-box;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            display: none;
        }

        .result-box.has-content {
            display: block;
            padding: 20px 22px;
            min-height: auto;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--result-title);
            letter-spacing: -0.2px;
        }

        .copy-btn {
            background: var(--theme-btn-bg);
            border: 1px solid var(--input-border);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .copy-btn:hover {
            color: var(--result-title);
            border-color: var(--result-title);
            background: var(--theme-btn-hover-bg);
        }

        .result-text {
            font-family: 'JetBrains Mono', 'Consolas', 'Courier New', Courier, monospace;
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--result-text);
            white-space: pre-wrap;
            word-break: break-word;
            background-color: var(--result-inner-bg);
            border: 1px solid var(--result-inner-border);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .loading-text {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--result-title);
            font-style: italic;
            background: none;
            border: none;
            padding: 4px 0;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }
        }

        /* Recommendations Section Specific Layout */
        .recommendations-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .recommendations-form .text-input {
            max-width: 420px;
            width: 100%;
            flex: none;
        }

        .recommendations-form .btn-primary {
            margin: 0 auto;
        }

        @media (max-width: 640px) {
            body {
                padding: 30px 16px 60px;
            }

            .top-nav {
                top: 12px;
                right: 14px;
            }

            .main-title {
                font-size: 26px;
            }

            .recommendations-form .text-input {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header-section">
            <h1 class="main-title">Welcome to EduGenie 🧠✨</h1>
            <p class="subtitle">Your personal AI tutor for learning support!</p>
        </header>

        <!-- 1. Ask EduGenie a Question -->
        <section class="feature-section">
            <h2 class="section-title">Ask EduGenie a Question:</h2>
            <div class="input-row">
                <input type="text" id="qaInput" class="text-input" placeholder="Why is the sky blue?">
                <button id="qaBtn" class="btn-primary">Get Answer</button>
            </div>
            <div id="qaResult" class="result-box"></div>
        </section>

        <!-- 2. Need an Explanation? -->
        <section class="feature-section">
            <h2 class="section-title">Need an Explanation?</h2>
            <div class="input-row">
                <input type="text" id="explainInput" class="text-input" placeholder="Photosynthesis">
                <button id="explainBtn" class="btn-primary">Explain</button>
            </div>
            <div id="explainResult" class="result-box"></div>
        </section>

        <!-- 3. Summarize a Paragraph -->
        <section class="feature-section">
            <h2 class="section-title">Summarize a Paragraph:</h2>
            <div class="input-row">
                <input type="text" id="summaryInput" class="text-input" placeholder="Paste long content to summarize">
                <button id="summaryBtn" class="btn-primary">Summarize</button>
            </div>
            <div id="summaryResult" class="result-box"></div>
        </section>

        <!-- 4. Generate a Quiz -->
        <section class="feature-section">
            <h2 class="section-title">Generate a Quiz:</h2>
            <div class="input-row">
                <input type="text" id="quizInput" class="text-input" placeholder="Solar System">
                <button id="quizBtn" class="btn-primary">Generate Quiz</button>
            </div>
            <div id="quizResult" class="result-box"></div>
        </section>

        <!-- 5. Get Learning Recommendations -->
        <section class="feature-section">
            <h2 class="section-title">Get Learning Recommendations:</h2>
            <div class="recommendations-form">
                <input type="text" id="learnInput" class="text-input" placeholder="e.g. Linear Regression">
                <button id="learnBtn" class="btn-primary">Get Recommendations</button>
            </div>
            <div id="learnResult" class="result-box"></div>
        </section>
    </div>

    <script>
        // API Configuration
        const GEMINI_API_KEY = "AQ.Ab8RN6KCXe9CMJTbV1EDZGwmTQQM5FRhiqULH-W4vCWdyRQLuw";

        // Prioritized verified active models
        const MODELS = [
            "gemini-flash-latest",
            "gemini-3.6-flash",
            "gemini-3.5-flash",
            "gemini-3.5-flash-lite",
            "gemini-3.8-flash",
            "gemini-2.5-flash-lite"
        ];

        const rootHtml = document.documentElement;
        rootHtml.setAttribute('data-theme', 'dark');

        // UI Render Helpers
        function renderLoading(boxId, title) {
            const box = document.getElementById(boxId);
            if (!box) return;
            box.classList.add('has-content');
            box.innerHTML = `
                <div class="result-header">
                    <span class="result-title">${title}:</span>
                </div>
                <div class="result-text loading-text">✨ Generating response from Gemini AI...</div>
            `;
        }

        function renderResult(boxId, title, content, isError = false) {
            const box = document.getElementById(boxId);
            if (!box) return;
            box.classList.add('has-content');

            if (isError) {
                box.innerHTML = `
                    <div class="result-header">
                        <span class="result-title" style="color: #ef4444;">${title}:</span>
                    </div>
                    <div class="result-text" style="color: #ef4444;">${escapeHtml(content)}</div>
                `;
            } else {
                const uniqueId = 'content_' + Math.random().toString(36).substring(2, 9);
                box.innerHTML = `
                    <div class="result-header">
                        <span class="result-title">${title}:</span>
                        <button class="copy-btn" onclick="copyContent('${uniqueId}', this)">📋 Copy</button>
                    </div>
                    <div id="${uniqueId}" class="result-text">${escapeHtml(content)}</div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyContent(targetId, btn) {
            const el = document.getElementById(targetId);
            if (!el) return;
            navigator.clipboard.writeText(el.innerText).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            }).catch(() => {
                btn.textContent = 'Failed';
            });
        }

        // Gemini API Caller
        async function callGemini(promptText) {
            let lastError = null;

            for (const model of MODELS) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
                    const response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-goog-api-key": GEMINI_API_KEY
                        },
                        body: JSON.stringify({
                            contents: [
                                {
                                    parts: [{ text: promptText }]
                                }
                            ]
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const parts = data.candidates?.[0]?.content?.parts || [];
                        let fullText = "";
                        for (const p of parts) {
                            if (p.text) fullText += p.text;
                        }
                        if (fullText.trim()) return fullText.trim();
                    } else {
                        const errJson = await response.json().catch(() => ({}));
                        console.warn(`Model ${model} returned error:`, errJson);
                        lastError = errJson.error?.message || `HTTP ${response.status}: ${response.statusText}`;
                    }
                } catch (networkErr) {
                    console.warn(`Network error with model ${model}:`, networkErr);
                    lastError = networkErr.message;
                }
            }

            throw new Error(lastError || "Could not retrieve a response from Gemini API.");
        }

        // Section setup
        function setupSection({ inputId, btnId, resultId, title, promptBuilder }) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);

            const execute = async () => {
                const query = input.value.trim() || input.placeholder;
                if (!query) return;

                renderLoading(resultId, title);
                btn.disabled = true;

                try {
                    const prompt = promptBuilder(query);
                    const result = await callGemini(prompt);
                    renderResult(resultId, title, result);
                } catch (err) {
                    renderResult(resultId, title, "Error: " + err.message, true);
                } finally {
                    btn.disabled = false;
                }
            };

            btn.addEventListener('click', execute);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') execute();
            });
        }

        // 1. Q&A
        setupSection({
            inputId: 'qaInput',
            btnId: 'qaBtn',
            resultId: 'qaResult',
            title: 'Answer',
            promptBuilder: (q) => `Please answer the following educational question clearly and concisely:\n${q}`
        });

        // 2. Explain
        setupSection({
            inputId: 'explainInput',
            btnId: 'explainBtn',
            resultId: 'explainResult',
            title: 'Explanation',
            promptBuilder: (topic) => `Please explain the following topic thoroughly, clearly, and simply for a student:\n${topic}`
        });

        // 3. Summarize
        setupSection({
            inputId: 'summaryInput',
            btnId: 'summaryBtn',
            resultId: 'summaryResult',
            title: 'Summary',
            promptBuilder: (text) => `Please provide a clear and concise summary of the following text:\n${text}`
        });

        // 4. Generate Quiz
        setupSection({
            inputId: 'quizInput',
            btnId: 'quizBtn',
            resultId: 'quizResult',
            title: 'Quiz',
            promptBuilder: (topic) => `Generate a 3-question multiple choice quiz on the topic "${topic}". Include 4 options (A, B, C, D) for each question, and provide the correct answers and a brief explanation at the end.`
        });

        // 5. Learning Recommendations
        setupSection({
            inputId: 'learnInput',
            btnId: 'learnBtn',
            resultId: 'learnResult',
            title: 'Recommendations',
            promptBuilder: (topic) => `Provide a structured step-by-step learning roadmap and resource recommendations for mastering: ${topic}. Include prerequisites, core concepts, and hands-on projects.`
        });
    </script>
</body>

</html>
